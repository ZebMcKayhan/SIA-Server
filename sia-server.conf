# ===================================================================
# Galaxy SIA Server Configuration
#
# This is the main configuration file for the server.
# Lines starting with '#' are comments and are ignored.
# ===================================================================


# ===================================================================
# SITE CONFIGURATION
#
# Each site/panel is defined by a section header with its unique
# ACCOUNT NUMBER in square brackets (e.g., [123456]).
# ===================================================================

# --- Example 1: A simple site with a public ntfy.sh topic ---
[987654]
SITE_NAME = My Home
ENABLED = Yes       # Yes | No | Secure (Secure means only enabled for encrypted sessions from panel)
PROVIDER = ntfy     # None | ntfy | pushover | telegram | webhook | ... (see providers folder)
NTFY_TITLE = Galaxy Alarm
NTFY_TOPIC = https://ntfy.sh/your-public-topic-for-home

# --- Example 2: Site with a private ntfy.sh topic and requires encryption from panel---
# [123456]
# SITE_NAME = The Cabin
# ENABLED = Secure
# PROVIDER = ntfy
# NTFY_TITLE = Cabin Alarm
# NTFY_TOPIC = https://ntfy.sh/your-private-cabin-topic
# NTFY_AUTH = Token                                  # None | Token | Userpass
# NTFY_TOKEN = tk_secrettokenforyourcabingoeshere    # Required if NTFY_AUTH = Token
# NTFY_USER = your_ntfy_username                     # Required if NTFY_AUTH = Userpass
# NTFY_PASS = your_ntfy_password                     # Required if NTFY_AUTH = Userpass

# --- Example 3: Sending notifications to telegram chat ---
# [111111]
# SITE_NAME = Test Panel
# ENABLED = Yes
# PROVIDER = telegram
# TELEGRAM_TITLE   = Galaxy Alarm                           # optional, default: 'Galaxy Alarm'
# TELEGRAM_TOKEN   = 123456789:ABCdefGHIjklMNOpqrSTUvwxYZ   # required
# TELEGRAM_CHAT_ID = 987654321                              # required
# TELEGRAM_API_URL = https://api.telegram.org               # optional, default: standard Telegram API

# --- Example 4: Sending notifications to pushover devices ---
# [222222]
# SITE_NAME = Test Panel
# ENABLED = Yes
# PROVIDER = pushover
# PUSHOVER_TITLE   = Galaxy Alarm         # optional, default: 'Galaxy Alarm'
# PUSHOVER_TOKEN   = ABCdefGHIjklMNOpqr   # required
# PUSHOVER_USER    = MNOpqrSTUvwxYZ       # required
# PUSHOVER_SOUND   = siren                # optional, default: pushover default sound
# PUSHOVER_RETRY   = 30                   # optional, seconds between retries for SIA priority 5, min 30
# PUSHOVER_EXPIRE  = 3600                 # optional, seconds until emergency stops retrying, max 10800
# PUSHOVER_DEVICE  =                      # optional, send to specific device only

# --- Example 5: Sending events to webhook ---
# [333333]
# SITE_NAME = Test Panel
# ENABLED = Yes
# PROVIDER = webhook
# WEBHOOK_URL      = https://your-server.com/alarm-hook  # required
# WEBHOOK_METHOD   = POST                                # POST | PUT (optional, default: POST)
# WEBHOOK_AUTH     = None | Token | Userpass             # None | Token | Userpass (optional, default: None)
# WEBHOOK_TOKEN    = ABCDEF123456                        # required if WEBHOOK_AUTH = Token
# WEBHOOK_USER     = username                            # required if WEBHOOK_AUTH = Userpass
# WEBHOOK_PASS     = password                            # required if WEBHOOK_AUTH = Userpass

# --- Example 6: A site with account enabled but notifications disabled ---
# [888888]
# SITE_NAME = Test Panel
# ENABLED = Yes
# PROVIDER = None

# --- Example 7: A site with account disabled (connection rejected) ---
# [999999]
# SITE_NAME = Test Panel
# ENABLED = No

# ===================================================================
# DEFAULT CONFIGURATION
#
# The [Default] section is used for any account number that is not
# explicitly defined above. If this section is missing or disabled,
# events from unknown accounts will only be logged.
# ===================================================================

[Default]
# SITE_NAME will be the account number itself unless "SITE_NAME =" is given.
ENABLED = Yes     # Set to No if you want the server to REJECT panels with this account.
PROVIDER = ntfy
NTFY_TOPIC = https://ntfy.sh/your-topic-for-unknown-alarms
NTFY_TITLE = Unknown Galaxy Alarm
# Authentication is also supported for the default topic
# NTFY_AUTH = Token
# NTFY_TOKEN = tk_secrettokenforunknownalarms


# ===================================================================
# SERVER CONFIGURATION
# ===================================================================

[SIA-Server]
# Settings for the main SIA Event Server. This section is mandatory.
ENABLED = Yes              # Yes | No (Default: Yes) set to 'No' if you only want to run ip-check server.
LISTEN_ADDR = 0.0.0.0
LISTEN_PORT = 10000
REJECT_POLICY = respond    # respond | drop (silently drops instead of sending REJECT)

[IP-Check]
# Settings for the optional IP Check (Heartbeat) Server.
# If this section is missing or ENABLED is No, this server will not start.
ENABLED = Yes
LISTEN_ADDR = 0.0.0.0
LISTEN_PORT = 10001

# --- Watchdog Settings ---
# WATCHDOG_THRESHOLD controls how many missed pings before connection is considered lost.
# Formula: threshold x ping_interval = time before alert.
# Example: 2.1 means 2 missed ping + 10% buffer before alerting. (occational missed pings wont generate notification)
# Example: 1.1 means 1 missed ping + 10% buffer before alerting. (single missed ping will give notification)
# Set to 0 (or any value <= 1.0) to disable the watchdog entirely.
WATCHDOG_THRESHOLD = 2.2     # Valid range: 1.1 - 10.0, set to 0 to disable

# Notification priorities for IP Check events (1=lowest, 5=highest/urgent)
MONITORING_STARTED_PRIO = 2   # Priority when monitoring starts for an account (default: 2)
CONNECTION_RESTORED_PRIO = 2  # Priority when heartbeat connection is restored (default: 2)
INTERVAL_CHANGED_PRIO = 3     # Priority when heartbeat interval changes (default: 3)
WATCHDOG_TIMEOUT_PRIO = 4     # Priority when heartbeat watchdog times out (default: 4)

# --- Notification Formats for IP Check Events ---
# Formats use %field or %field{format} syntax.
# Available fields:
#   %account, %site_name, %current_state, %new_state
#   %last_panel_time, %last_interval, %last_threshold, %last_seen, %elapsed
#   %new_panel_time, %new_interval, %new_threshold
#   Server time: %YYYY, %YY, %MM, %DD, %hh, %mm, %ss, %time
#
# Timestamp formats: %YYYY, %YY, %MM, %DD, %hh, %mm, %ss
# Duration formats:  %DD, %hh, %mm, %ss (e.g. %elapsed{%DDd %hh:%mm:%ss})
# Optional sections enclosed in [ ... ] are omitted if any field inside is unavailable.
#
# If not configured:
#   MONITORING_STARTED   - No notification
#   INTERVAL_CHANGED     - No notification
#   CONNECTION_RESTORED  - Defaults to: Heartbeat received at %new_panel_time, connection restored
#   WATCHDOG_TIMEOUT     - Defaults to: Heartbeat lost, last heartbeat received was %last_panel_time
#
# MONITORING_STARTED  = Monitoring started at %new_panel_time{%YYYY-%MM-%DD %hh:%mm:%ss} interval: %new_interval{%hh:%mm:%ss} (%new_interval{%sss})\nWill trigger if no heartbeat for %new_threshold{%hh:%mm:%ss} (%new_threshold{%sss})
# CONNECTION_RESTORED = Monitoring restored at %new_panel_time{%YYYY-%MM-%DD %hh:%mm:%ss}, after %elapsed{%DDd %hh:%mm:%ss}
# INTERVAL_CHANGED    = Heartbeat interval changed from %last_interval{%hh:%mm:%ss} (%last_interval{%sss}) to %new_interval{%hh:%mm:%ss} (%new_interval{%sss}), new Timeout: %new_threshold{%hh:%mm:%ss} (%new_threshold{%sss})
# WATCHDOG_TIMEOUT    = Heartbeat lost. Last heartbeat: %last_panel_time{%hh:%mm:%ss}. Last seen: %last_seen{%YYYY-%MM-%DD %hh:%mm:%ss}. Timeout: %elapsed{%DDd %hh:%mm:%ss}

[Logging]
# General logging settings for both servers.
LOG_LEVEL = INFO     # Options: DEBUG, INFO, WARNING, ERROR
LOG_TO = Screen      # Options: Screen, File, Syslog
# Only used if LOG_TO = File:
LOG_FILE = /tmp/sia-server.log # Use Windows paths like C:\Logs\sia.log if needed.
LOG_MAX_MB = 10      # Log file size in MB (1-100)
LOG_BACKUP_COUNT = 5 # Nr of log files to keep (1-10)
# Optional, Only used if LOG_TO = Syslog:
#SYSLOG_SOCKET = /var/run/syslog  # only if /dev/log needs override.
#SYSLOG_FACILITY = daemon # only if the standard 'user' needs override. daemon, local0, local1 etc.

[Notification]
# ======= Notification Format ========
# Notification formats use %field to insert information from the Galaxy event.
#
# Available fields:
#   Panel fields:
#     %time                Event time (from panel, if present)
#     %action_text         Human-readable text from the SIA ASCII block
#     %account             Account number
#     %site_name           Site name
#     %event_type          Event type (New/Old)
#     %event_code          SIA event code (e.g. OP, BA, RX)
#     %event_description   Description of the event code
#     %user_id             User ID
#     %zone                Zone address
#     %group               Group number
#     %peripheral          Peripheral/module number
#     %value               Event value
#
#   Server Date & Time fields (server local time when event is processed):
#     %YYYY                4-digit server year (e.g. 2026)
#     %YY                  2-digit server year (e.g. 26)
#     %MM                  2-digit server month (01-12)
#     %DD                  2-digit server day (01-31)
#     %hh                  2-digit server hour (00-23)
#     %mm                  2-digit server minute (00-59)
#     %ss                  2-digit server second (00-59)
#
#   Note: %time is the event time received from the alarm panel (if present),
#   while %YY, %YYYY, %MM, %DD, %hh, %mm, and %ss represent the server's own clock.
#
# Sections enclosed in [ ] are optional. The entire section is omitted
# if any field used inside the section is unavailable.
#
# Use \n to insert a newline in the notification (can also be used inside
# optional sections, e.g. [\nGroup: %group]).
#
# This format is used for SIA level 3 where action_text are available:
NOTIFICATION_FORMAT_ASCII = %time %action_text [(Group: %group)]
# This format is used for SIA level 0-2 where only event data is available:
NOTIFICATION_FORMAT_DATA = %time Event: %event_code [(%event_description)][ User: %user_id][ Zone: %zone][ Group: %group][ Peripheral: %peripheral][ Value: %value]

# ======= Notification Priorities ========
# Notification Event priority (see full list in galaxy/constants.py)
# Very low priority (1) - ?
PRIORITY_1 = # Fill in codes if you wish, not used default.

# Low priority (2) - Tests and routine events
# RX - Manual test  RP - Automatic test TS - Test start TE - Test end
PRIORITY_2 = RX, RP, TS, TE 

# Normal priority (3) - Arm/Disarm/User actions
# CL - Closing (Armed), OP - Opening (Disarmed), CA - Automatic closing
# OA - Automatic opening, BC - Burglary cancelled (user reset)
# OR - Opening restore / Alarm restore, OG - Area Opened CG - Area Closed
PRIORITY_3 = CL, OP, CA, OA, BC, OR, OG, CG

# High priority (4) - System issues (non-critical)
# AR - AC restore (mains power back), XR - Battery restore
PRIORITY_4 = AR, XR

# Urgent (5) - Alarm
# BA: Burglary alarm, BV: Burglary verified, TA: Tamper alarm, FA: Fire alarm 
# PA: Panic alarm, AT: AC trouble (mains failure), XT: Battery trouble
PRIORITY_5 = BA, BV, TA, FA, PA, AT, XT

# Default priority for unknown/unlisted event codes
DEFAULT_PRIORITY = 5  # Urgent - better safe than sorry!

# =======  General settings for Notification que ======= 
MAX_QUE_SIZE = 50    # Number between 1 and 1000 Maximum number of events to queue up if failed to send. 
MAX_RETRIES = 10     # 0 = infinite, Maximum number of times to retry to send.
MAX_RETRY_TIME = 30  # Number between 1-1000, Max minutes between retries.


